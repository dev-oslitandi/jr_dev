# Modify bucket settings to increase performance and reduce storage
# All settings below are applied via the [default] stanza unless overridden
# in specific index stanzas.

[default]
# =========================================================================
# PERFORMANCE & STORAGE REDUCTION FIXES
# =========================================================================

# FIX 1: Correctly set frozenTimePeriodInSecs to 3 months to match the storage
# reduction goal, NOT 1 year (31536000). This ensures data is deleted/archived quickly.
frozenTimePeriodInSecs = 7776000 # 3 months = 90 days * 24 * 60 * 60

# FIX 2: Set maxDataSize to 'auto_high_volume' (10GB) for larger hot buckets.
# This REDUCES the number of buckets, significantly boosting search performance.
maxDataSize = auto_high_volume

# FIX 3: Increase concurrent hot buckets for better indexing throughput in high-volume environments.
maxHotBuckets = 10

# FIX 4: Enable TSIDX minification to significantly REDUCE cold storage footprint (up to 40%).
enableTsidxReduction = true

# Sets the minimum age for a bucket to be eligible for TSIDX reduction (30 days in cold/warm).
timePeriodInSecBeforeTsidxReduction = 2592000 # 30 days

# FIX 5: Ensure [default] uses volume-based paths to match explicit indexes below.
# This ensures new indexes inherit the volume management structure.
homePath = volume:primary/defaultdb/db # Hot and warm buckets
coldPath = volume:primary/defaultdb/colddb # Cold buckets

# =========================================================================
# OTHER SETTINGS (Carried over from original)
# =========================================================================
maxHotSpanSecs = 7776000 # 3 months (90 days)
thawedPath = $SPLUNK_DB/defaultdb/thaweddb # Thawed buckets
coldToFrozenDir = /opt/splunk/frozen_data # Frozen bucket directory

journalCompression = zstd
tsidxWritingLevel = 4

